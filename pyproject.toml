[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "controlador-mercado"
version = "0.1.0"
description = "Agente Controlador de Mercado: inteligencia de mercado externa (mercado cubano) para un sistema multiagente."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["anthropic>=1.9"]

[project.optional-dependencies]
dev = ["pytest>=8"]
navegador = ["playwright>=1.55"]

[project.scripts]
controlador-mercado = "controlador_mercado.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
controlador_mercado = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
